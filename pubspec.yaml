name: flutter_ecommerce_app
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1
environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9

# Flutter Business Logic Component.
  flutter_bloc: ^9.1.1
  persistent_bottom_nav_bar_v2: ^6.4.0
  flutter_carousel_widget: ^3.1.1
  cached_network_image: ^3.4.1
  flutter_dash: ^1.0.0
  font_awesome_flutter: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
   - assets/images/category_images/
   - assets/images/home_images/
   - assets/images/payment_methods_images/
   - assets/images/signin_signup_images/

